<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200;300;400;500;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Google Icons -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />

    <style>
      body {
        font-family: "Tajawal", sans-serif;
        font-weight: 400;
        font-style: normal;
      }
      .tasks-table {
        background-color: rgb(239 239 239);
        width: 90%;
        margin-top: 80px;
      }
      .tasks-table button{
        margin-top: auto;
        margin-bottom: auto;
      }      
      .tasks-table h1{
        margin-top: auto;
        margin-bottom: auto;
      }      
      .task {
        display: flex;
        flex-direction: column;
        background-color: white;
        padding: 4px;
        border-bottom: solid 1px black;
        transition: 0.09s;
      }
      .done {
        background-color: rgb(175, 253, 175);
      }
      .task:hover {
        box-shadow: 0px 3px 15px rgba(97, 97, 97, 0.843);
      }
      button {
        border: none;
        font-size: 20px;
        box-shadow: 0px 3px 5px rgba(168, 168, 168, 0.38);
      }
      .task button {
        margin-left: 20px;
        margin-top: 10px;
      }
      button.circular {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        line-height: 0;
      }

      @media (min-width: 768px) {
        .tasks-table {
          width: 750px;
        }
        .task {
          flex-direction: row;
        }
        .task button {
          margin: 0px;
        }
      }
      @media (min-width: 992px) {
        .tasks-table {
          width: 970px;
        }
        .task {
          flex-direction: row;
        }
        .task button {
          margin: 0px;
        }
      }
      @media (min-width: 1200px) {
        .tasks-table {
          width: 1170px;
        }
        .task {
          flex-direction: row;
        }
        .task button {
          margin: 0px;
        }
      }
    </style>
  </head>
  <body style="background-color: rgb(30 0 77)">
    <div style="direction: rtl">
      <!-- CENTER DIV -->
      <div style="display: flex; justify-content: center; align-items: center">
        <!-- TASKS TABLE -->
        <div class="tasks-table">
          <!-- HEADER -->
          <div
            style="
              display: flex;
              justify-content: space-between;
              width: 100%;
              text-align: center;
              background: rgb(92, 52, 155);
              color: white;
              padding-bottom: 8px;
              padding-top: 8px;
            "
          >
            <button
              class="circular"
              style="background-color: white; margin-right: 5px"
            >
              <span id="add-btn" class="material-symbols-outlined"> add </span>
            </button>
            <h1 style="display: inline">مهامي</h1>
            <div style="width: 40px;"></div>
          </div>
          <!--// HEADER //-->

          <!-- Tasks -->
          <div id="tasks"></div>
          <!--// Tasks //-->
        </div>
        <!--// TASKS TABLE //-->
      </div>
      <!--// CENTER DIV //-->
    </div>
  </body>

  <script>
    function refreshTasksTable(tasks) {
      if (tasks == null) return;

      document.getElementById("tasks").innerHTML = "";
      var index = 0;
      for (task of tasks) {
        let content = `
            <div class="task ${task.isDone ? "done" : ""}" style="margin: 20px">
              <!-- Task Info -->
              <div style="width: 70%">
                <h2>${task.title}</h2>
                <div>
                  <span class="material-symbols-outlined">
                    calendar_month
                  </span>
                  <span>${task.date}</span>
                </div>
              </div>
              <!--// Task Info //-->
              <!-- Task Actions -->
              <div
                style="
                  width: 20%;
                  display: flex;
                  justify-content: space-between;
                  align-items: center;
                "
              >
                <button
                  class="circular"
                  style="background-color: rgb(114, 0, 0); color: white"
                  onClick="deleteTask(${index})"
                >
                  <span class="material-symbols-outlined"> delete </span>
                </button>
                <button
                  class="circular"
                  style="${task.isDone ? "background-color: rgb(129, 51, 51)" : "background-color: rgb(0, 150, 30)"}; color: white"
                  onClick="toggleTaskCompletion(${index})"
                >
                  ${task.isDone ? '<span class="material-symbols-outlined"> close </span>' : '<span class="material-symbols-outlined"> done </span>'}
                </button>
                <button
                  class="circular"
                  style="
                    background-color: rgba(0, 16, 197, 0.692);
                    color: white;
                  "
                  onClick="updateTask(${index})"
                >
                  <span class="material-symbols-outlined"> edit </span>
                </button>
              </div>
              <!--// Task Actions //-->
            </div>`;
        document.getElementById("tasks").innerHTML += content;
        index++;
      }
    }
    function setTasksArrayBasedOnLocalStorage() {
      tasks = JSON.parse(localStorage.getItem("Tasks")) ?? [];
      refreshTasksTable(tasks);
    }
    function storeTasks() {
      var tasksString = JSON.stringify(tasks);
      localStorage.setItem("Tasks", tasksString);
    }
    let tasks = [];
    setTasksArrayBasedOnLocalStorage();

    refreshTasksTable(tasks);

    document.getElementById("add-btn").addEventListener("click", () => {
      let title = prompt("الرجاء إدخال عنوان مهمة جديدة:");
      if (title == null) return;

      let date = `${new Date().getDate()}/${new Date().getMonth() + 1}/${new Date().getFullYear()}`;

      let task = {
        title: title,
        date: date,
        isDone: false,
      };

      tasks.push(task);

      storeTasks();
      refreshTasksTable(tasks);
    });

    function deleteTask(index) {
      let isConfirmed = confirm(
        `هل أنت متأكد من حذف هذه المهمة: (${tasks[index].title})؟`,
      );
      if (isConfirmed == 0) return;

      tasks.splice(index, 1);
      storeTasks();
      refreshTasksTable(tasks);
    }

    function updateTask(index) {
      let title = prompt("ادخل الاسم الجديد:");
      if (title == null) return;

      tasks[index].title = title;

      let date = `${new Date().getDate()}/${new Date().getMonth() + 1}/${new Date().getFullYear()}`;
      tasks[index].date = date;
      storeTasks();
      refreshTasksTable(tasks);
    }

    function toggleTaskCompletion(index) {
      tasks[index].isDone = !tasks[index].isDone;
      storeTasks();
      refreshTasksTable(tasks);
    }
  </script>
</html>
